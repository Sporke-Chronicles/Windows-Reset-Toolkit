name: Bug report
description: Report a reproducible problem with a toolkit workflow.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste BitLocker recovery keys, credentials, tenant secrets, or unredacted customer logs.**
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Intune WinRE Readiness
        - Intune Carve-Out Full Reset
        - ConfigMgr Carve-Out Reset
        - Repository CI / documentation
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Toolkit release / commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition/build
      placeholder: Windows 11 Enterprise 24H2, build ...
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Disk / Recovery / BitLocker / storage-controller context
      description: Provide a sanitized summary; do not include recovery secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized log excerpt
    validations:
      required: true
