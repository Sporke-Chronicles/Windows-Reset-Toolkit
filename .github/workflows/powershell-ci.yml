name: PowerShell CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Windows PowerShell 5.1 syntax validation
        shell: powershell
        run: .\tools\Test-PowerShellSyntax.ps1 -Path .

      - name: PSScriptAnalyzer error scan
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path .\scripts -Recurse -Severity Error)
          $findings | Format-Table -AutoSize
          if ($findings.Count -gt 0) { throw "PSScriptAnalyzer found $($findings.Count) Error-severity finding(s)." }

      - name: Pester static safety tests
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester -Path .\tests -CI
